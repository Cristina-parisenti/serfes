name: Patch education form

on:
  push:
    paths:
      - '.github/workflows/patch-education-form.yml'
      - 'scripts/patch_education_form.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply education catalog rules
        run: python scripts/patch_education_form.py

      - name: Validate build
        run: |
          npm install
          npm run build

      - name: Commit
        run: |
          git config user.name "Cristina-parisenti"
          git config user.email "crislu88@hotmail.com"
          git add src/App.tsx
          git commit -m "Integrate education catalogs and age-aware school levels"
          git push
