name: Refine education source messages

on:
  push:
    paths:
      - '.github/workflows/patch-education-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refine copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          t=p.read_text(encoding='utf-8')
          t=t.replace("                            {athleteAge !== null && <small className=\"field-help\">O SERFES mostra somente níveis compatíveis com a idade informada, conforme a regra operacional do cadastro.</small>}\n", "")
          t=t.replace("placeholder={!schoolLevel ? 'Selecione primeiro o nível de ensino' : 'Base oficial em sincronização — informe temporariamente'}", "placeholder={!schoolLevel ? 'Selecione primeiro o nível de ensino' : 'Informe temporariamente a instituição'}")
          old="""                            {schoolLevel && !institutionCatalogReady && <small className=\"field-help\">A fonte oficial ainda está em processo de sincronização no protótipo. O campo manual permanece disponível temporariamente.</small>}"""
          new="""                            {schoolLevel && !institutionCatalogReady && <small className=\"field-help\">{schoolLevel === 'Ensino superior' ? 'A consulta automatizada ao e-MEC ainda não está disponível. Informe temporariamente a instituição.' : 'O catálogo oficial da SEED/PR está sendo sincronizado. Informe temporariamente a escola.'}</small>}"""
          if old not in t: raise SystemExit('institution help not found')
          t=t.replace(old,new,1)
          t=t.replace("placeholder={higherEducation?.courses.length ? 'Digite ou selecione o curso' : 'Catálogo oficial em sincronização'}", "placeholder={higherEducation?.courses.length ? 'Digite ou selecione o curso' : 'Informe o curso'}")
          old="""                              <small className=\"field-help\">As denominações serão mantidas pelo catálogo oficial do MEC/e-MEC. Enquanto a fonte automática não estiver disponível, o preenchimento permanece manual.</small>"""
          new="""                              <small className=\"field-help\">O Cadastro e-MEC será a fonte oficial deste campo. Enquanto a consulta automatizada não estiver disponível, informe o curso manualmente.</small>"""
          if old not in t: raise SystemExit('course help not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name "Cristina-parisenti"
          git config user.email "crislu88@hotmail.com"
          git add src/App.tsx
          git commit -m "Clarify official education source fallbacks"
          git pull --rebase origin main
          git push origin main
