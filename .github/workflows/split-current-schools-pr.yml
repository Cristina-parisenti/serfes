name: Generate current Paraná school network catalogs

on:
  push:
    paths:
      - '.github/workflows/split-current-schools-pr.yml'

permissions:
  contents: write

concurrency:
  group: schools-pr-split-once
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Split current official SEED-PR catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('public/schools-pr.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          records = payload.get('records', [])
          files = {
              'Federal': 'public/schools-pr-federal.json',
              'Estadual': 'public/schools-pr-estadual.json',
              'Municipal': 'public/schools-pr-municipal.json',
              'Privada': 'public/schools-pr-privada.json',
          }
          if len(records) < 1000:
              raise SystemExit(f'Catálogo atual incompleto: {len(records)} registros')
          def valid_name(record):
              name = str(record.get('name') or '').strip().lower()
              return bool(name) and not name.startswith('br.gov.pr.') and 'estabelecimentows@' not in name
          for network, filename in files.items():
              selected = [record for record in records if record.get('network') == network and valid_name(record)]
              if not selected:
                  raise SystemExit(f'Nenhum registro válido da rede {network}')
              out = {
                  'source': payload.get('source', 'Consulta Escolas/SEED-PR'),
                  'sourceUrl': payload.get('sourceUrl'),
                  'generatedAt': payload.get('generatedAt'),
                  'records': selected,
              }
              Path(filename).write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(network, len(selected))
          PY
      - name: Commit network catalogs
        run: |
          git config user.name "SERFES School Catalog"
          git config user.email "actions@users.noreply.github.com"
          git add public/schools-pr-federal.json public/schools-pr-estadual.json public/schools-pr-municipal.json public/schools-pr-privada.json
          git commit -m "Clean Paraná school catalogs by network"
          git pull --rebase origin main
          git push origin main
