name: Inspect official higher education dataset API

on:
  push:
    paths:
      - '.github/workflows/inspect-dados-gov-higher-ed.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Dados Abertos public API correctly
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://dados.gov.br/dados/api/publico/conjuntos-dados'
          params={
            'nomeConjuntoDados':'Sistema e-MEC - Cursos de Graduação do Brasil',
            'pagina':'0',
          }
          url=base+'?'+urllib.parse.urlencode(params)
          print('LIST URL',url)
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'SERFES/1.0'})
          try:
            with urllib.request.urlopen(req,timeout=45) as r:
              raw=r.read().decode('utf-8','replace')
              print('LIST STATUS',r.status,'LEN',len(raw))
              print(raw[:30000])
              data=json.loads(raw)
              if isinstance(data,list) and data:
                item=data[0]
                print('ITEM KEYS', sorted(item.keys()))
                print('ITEM', json.dumps(item, ensure_ascii=False)[:12000])
                dataset_id=item.get('id') or item.get('idConjuntoDados') or item.get('identificador')
                if dataset_id:
                  detail=base+'/'+urllib.parse.quote(str(dataset_id),safe='')
                  print('DETAIL URL',detail)
                  req2=urllib.request.Request(detail,headers={'Accept':'application/json','User-Agent':'SERFES/1.0'})
                  with urllib.request.urlopen(req2,timeout=45) as r2:
                    raw2=r2.read().decode('utf-8','replace')
                    print('DETAIL STATUS',r2.status,'LEN',len(raw2))
                    print(raw2[:50000])
          except Exception as e:
            print('ERROR',repr(e))
          PY
