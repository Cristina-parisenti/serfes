name: Inspect official higher education dataset API

on:
  push:
    paths:
      - '.github/workflows/inspect-dados-gov-higher-ed.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query anonymous dataset detail endpoint
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://dados.gov.br/api/publico/conjuntos-dados/sistema-e-mec---cursos-de-graduacao-do-brasil'
          print('URL', url)
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0 SERFES/1.0'})
          try:
            with urllib.request.urlopen(req,timeout=45) as r:
              raw=r.read().decode('utf-8','replace')
              print('STATUS',r.status,'LEN',len(raw),'TYPE',r.headers.get('content-type'))
              print(raw[:60000])
              try:
                data=json.loads(raw)
                print('TOP TYPE', type(data).__name__)
                if isinstance(data,dict):
                  print('TOP KEYS', sorted(data.keys()))
                  for key,value in data.items():
                    if any(term in key.lower() for term in ('recurso','resource','arquivo','file','url','link')):
                      print('FIELD', key, json.dumps(value, ensure_ascii=False)[:30000])
              except Exception as exc:
                print('JSON ERROR',repr(exc))
          except Exception as e:
            print('ERROR',repr(e))
          PY
