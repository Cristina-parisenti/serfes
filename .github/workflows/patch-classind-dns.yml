name: Patch ClassInd DNS fallback

on:
  push:
    paths:
      - '.github/workflows/patch-classind-dns.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Adicionar fallback DNS seguro para a fonte oficial
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sync_classind.py')
          text = path.read_text(encoding='utf-8')

          old = """import re\nimport sys\nimport time\nimport unicodedata\nimport urllib.error\nimport urllib.request"""
          new = """import re\nimport subprocess\nimport sys\nimport time\nimport unicodedata\nimport urllib.error\nimport urllib.request\nfrom urllib.parse import urlparse"""
          if old not in text:
              raise SystemExit('Bloco de imports não encontrado')
          text = text.replace(old, new, 1)

          old = """            if attempt + 1 < attempts:\n                time.sleep(3 * (attempt + 1))\n    raise RuntimeError(f'Falha ao acessar fonte oficial: {url}: {last_error}')"""
          new = """            if attempt + 1 < attempts:\n                time.sleep(3 * (attempt + 1))\n\n    host = urlparse(url).hostname\n    if host == 'dados.mj.gov.br':\n        try:\n            dns_req = urllib.request.Request(\n                f'https://dns.google/resolve?name={host}&type=A',\n                headers={'Accept': 'application/dns-json', 'User-Agent': 'SERFES-ClassInd-Sync/1.0'},\n            )\n            with urllib.request.urlopen(dns_req, timeout=20) as response:\n                dns_payload = json.load(response)\n            ips = [\n                item.get('data') for item in dns_payload.get('Answer', [])\n                if item.get('type') == 1 and item.get('data')\n            ]\n            for ip in ips:\n                result = subprocess.run(\n                    [\n                        'curl', '--fail', '--silent', '--show-error', '--location',\n                        '--connect-timeout', '20', '--max-time', str(max(timeout * 2, 60)),\n                        '--retry', '2', '--retry-delay', '2',\n                        '--resolve', f'{host}:443:{ip}',\n                        '-H', 'User-Agent: SERFES-ClassInd-Sync/1.0',\n                        url,\n                    ],\n                    capture_output=True,\n                    check=False,\n                )\n                if result.returncode == 0 and result.stdout:\n                    print(f'Fonte oficial acessada com resolução DNS alternativa ({ip}).', file=sys.stderr)\n                    return result.stdout\n                last_error = result.stderr.decode('utf-8', errors='replace').strip() or last_error\n        except Exception as exc:\n            last_error = exc\n\n    raise RuntimeError(f'Falha ao acessar fonte oficial: {url}: {last_error}')"""
          if old not in text:
              raise SystemExit('Bloco fetch_bytes não encontrado')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "Cristina-parisenti"
          git config user.email "crislu88@hotmail.com"
          git add scripts/sync_classind.py
          git commit -m "Add DNS fallback for official ClassInd sync"
          git push
