name: Sincronizar escolas do Paraná

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * 0'
  push:
    paths:
      - 'scripts/sync_schools_pr.py'
      - '.github/workflows/sync-schools-pr.yml'

permissions:
  contents: write

concurrency:
  group: schools-pr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sincronizar Consulta Escolas/SEED-PR
        run: python scripts/sync_schools_pr.py

      - name: Publicar catálogo atualizado
        run: |
          if git diff --quiet -- public/schools-pr.json; then
            echo "Nenhuma alteração no catálogo de escolas."
            exit 0
          fi
          git config user.name "SERFES School Sync"
          git config user.email "actions@users.noreply.github.com"
          git add public/schools-pr.json
          git commit -m "Atualizar catálogo oficial de escolas do Paraná"
          git pull --rebase origin main
          git push origin main
