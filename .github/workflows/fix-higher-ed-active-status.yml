name: Fix higher education active status filter

on:
  push:
    paths:
      - '.github/workflows/fix-higher-ed-active-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fix inactive course filtering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/sync_higher_education.py')
          text = path.read_text(encoding='utf-8')
          old = """    value = norm(situation)\n    return 'ativo' in value or value in {'1', 'em atividade'}\n"""
          new = """    value = norm(situation)\n    if any(term in value for term in ('inativo', 'desativado', 'extinto', 'em extincao')):\n        return False\n    return value == 'ativo' or value.startswith('ativo ') or value in {'1', 'em atividade'}\n"""
          if old not in text:
              raise SystemExit('Active-status block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate Python
        run: python -m py_compile scripts/sync_higher_education.py
      - name: Commit change
        run: |
          git config user.name "SERFES Higher Education Sync"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/sync_higher_education.py
          git commit -m "Exclude inactive higher education courses"
          git pull --rebase origin main
          git push origin main
