name: Patch game catalog

on:
  push:
    paths:
      - '.github/workflows/patch-game-catalog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update game options
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''                              <option value="" disabled>Selecione</option>\n                              <option>Valorant</option><option>League of Legends</option><option>EA Sports FC</option><option>Counter-Strike 2</option><option>Rocket League</option><option>Outra</option>'''
          new = '''                              <option value="" disabled>Selecione</option>\n                              <option>Free Fire</option>\n                              <option>Tekken</option>\n                              <option>Street Fighter</option>\n                              <option>EA FC</option>\n                              <option>PES</option>\n                              <option>Fortnite</option>\n                              <option>Valorant</option>\n                              <option>League of Legends</option>\n                              <option>Counter Strike</option>\n                              <option>Brawl Stars</option>\n                              <option>Clash Royale</option>\n                              <option>Just Dance</option>'''
          if old not in text:
              raise SystemExit('Expected game option block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "Cristina-parisenti"
          git config user.email "crislu88@hotmail.com"
          git add src/App.tsx
          git commit -m "Update athlete game catalog"
          git push

# one-time trigger
