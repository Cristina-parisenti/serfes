name: Enforce official Paraná education catalogs

on:
  push:
    paths:
      - '.github/workflows/strict-education-catalogs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce catalog-only institution and course choices
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old_fallback = """                            ) : (\n                              <input\n                                required={enrollmentStatus === 'Sim'}\n                                disabled={enrollmentStatus !== 'Sim' || !schoolMunicipality || !schoolNetwork || !schoolLevel}\n                                value={athleteInstitution}\n                                onChange={(e) => setAthleteInstitution(e.target.value)}\n                                placeholder={!schoolLevel ? 'Selecione primeiro o nível de ensino' : 'Informe temporariamente a instituição'}\n                              />\n                            )}\n                            {schoolLevel && !institutionCatalogReady && <small className=\"field-help\">{schoolLevel === 'Ensino superior' ? 'A consulta automatizada ao e-MEC ainda não está disponível. Informe temporariamente a instituição.' : 'O catálogo oficial da SEED/PR está sendo sincronizado. Informe temporariamente a escola.'}</small>}\n"""
          new_fallback = """                            ) : (\n                              <input\n                                disabled\n                                value=\"\"\n                                placeholder={!schoolLevel ? 'Selecione primeiro o nível de ensino' : 'Aguardando catálogo oficial'}\n                              />\n                            )}\n                            {schoolLevel && !institutionCatalogReady && <small className=\"field-help\">{schoolLevel === 'Ensino superior' ? 'Aguardando sincronização com a base oficial de instituições e cursos de ensino superior. O SERFES não aceitará instituição informada manualmente.' : 'Aguardando sincronização com a Consulta Escolas/SEED-PR. O SERFES não aceitará escola informada manualmente.'}</small>}\n"""
          if old_fallback not in text:
              raise SystemExit('Institution fallback block not found')
          text = text.replace(old_fallback, new_fallback, 1)

          old_course = """                            <label>Curso\n                              <input\n                                required\n                                list=\"higher-education-courses\"\n                                disabled={!athleteInstitution}\n                                value={higherEducationCourse}\n                                onChange={(e) => setHigherEducationCourse(e.target.value)}\n                                placeholder={higherCourseOptions.length ? 'Digite ou selecione o curso' : (athleteInstitution ? 'Catálogo oficial ainda não disponível' : 'Selecione primeiro a instituição')}\n                              />\n                              <datalist id=\"higher-education-courses\">\n                                {higherCourseOptions.map((course) => <option key={course.id} value={course.name} />)}\n                              </datalist>\n                              <small className=\"field-help\">Os cursos são vinculados à instituição selecionada e limitados às ofertas oficiais localizadas no Paraná.</small>\n                            </label>\n"""
          new_course = """                            <label>Curso\n                              <select\n                                required\n                                disabled={!athleteInstitution || higherCourseOptions.length === 0}\n                                value={higherEducationCourse}\n                                onChange={(e) => setHigherEducationCourse(e.target.value)}\n                              >\n                                <option value=\"\" disabled>{!athleteInstitution ? 'Selecione primeiro a instituição' : (higherCourseOptions.length ? 'Selecione' : 'Aguardando catálogo oficial')}</option>\n                                {higherCourseOptions.map((course) => <option key={course.id} value={course.name}>{course.name}</option>)}\n                              </select>\n                              <small className=\"field-help\">São exibidos somente cursos oficiais vinculados à instituição selecionada e com oferta localizada no Paraná.</small>\n                            </label>\n"""
          if old_course not in text:
              raise SystemExit('Higher course block not found')
          text = text.replace(old_course, new_course, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate build
        run: npm install && npm run build
      - name: Commit changes
        run: |
          git config user.name "SERFES Education Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Require official Paraná institution and course catalogs"
          git pull --rebase origin main
          git push origin main
