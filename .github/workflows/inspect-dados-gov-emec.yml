name: Inspect data.gov e-MEC API

on:
  push:
    paths:
      - '.github/workflows/inspect-dados-gov-emec.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query public catalog API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          urls = [
            'https://dados.gov.br/dados/api/publico/conjuntos-dados?titulo=' + urllib.parse.quote('Sistema e-MEC - Cursos de Graduação do Brasil'),
            'https://dados.gov.br/dados/api/publico/conjuntos-dados?termo=' + urllib.parse.quote('e-MEC'),
            'https://dados.gov.br/dados/api/publico/conjuntos-dados?pagina=0&tamanhoPagina=20&titulo=' + urllib.parse.quote('e-MEC'),
          ]
          for url in urls:
            print('\nURL', url)
            try:
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'SERFES/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                raw = r.read().decode('utf-8','replace')
                print('STATUS', r.status, 'LEN', len(raw))
                print(raw[:12000])
            except Exception as e:
              print('ERROR', repr(e))
          PY
