name: Add legal guardian relationship fields

on:
  push:
    paths:
      - '.github/workflows/patch-responsible-relation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch guardian relationship flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')

          old = """  const [responsibleName, setResponsibleName] = useState('');\n  const [responsibleCpf, setResponsibleCpf] = useState('');\n  const [responsibleEmail, setResponsibleEmail] = useState('');\n  const [responsiblePhone, setResponsiblePhone] = useState('');"""
          new = """  const [responsibleName, setResponsibleName] = useState('');\n  const [responsibleLegalCapacity, setResponsibleLegalCapacity] = useState('');\n  const [responsibleOtherCapacity, setResponsibleOtherCapacity] = useState('');\n  const [responsibleProofDocument, setResponsibleProofDocument] = useState<File | null>(null);\n  const [responsibleCpf, setResponsibleCpf] = useState('');\n  const [responsibleEmail, setResponsibleEmail] = useState('');\n  const [responsiblePhone, setResponsiblePhone] = useState('');"""
          if old not in text:
              raise SystemExit('state block not found')
          text = text.replace(old, new, 1)

          old = """  const responsibleCpfInvalid = responsibleCpf.length > 0 && !isValidCpf(responsibleCpf);"""
          new = """  const responsibleNeedsProof = ['Tutor(a)', 'Guardião(ã) judicial', 'Outro responsável legal'].includes(responsibleLegalCapacity);\n  const responsibleCapacityLabel = responsibleLegalCapacity === 'Outro responsável legal'\n    ? responsibleOtherCapacity.trim() || 'Outro responsável legal'\n    : responsibleLegalCapacity;\n  const responsibleCpfInvalid = responsibleCpf.length > 0 && !isValidCpf(responsibleCpf);"""
          if old not in text:
              raise SystemExit('validation anchor not found')
          text = text.replace(old, new, 1)

          old = """    const responsibleFieldsValid = minorStatus !== true || (\n      responsibleName.trim().length > 0 &&\n      isValidCpf(responsibleCpf) &&\n      isValidEmail(responsibleEmail) &&\n      isValidPhone(responsiblePhone)\n    );"""
          new = """    const responsibleFieldsValid = minorStatus !== true || (\n      responsibleName.trim().length > 0 &&\n      responsibleLegalCapacity.length > 0 &&\n      (responsibleLegalCapacity !== 'Outro responsável legal' || responsibleOtherCapacity.trim().length > 0) &&\n      (!responsibleNeedsProof || responsibleProofDocument !== null) &&\n      isValidCpf(responsibleCpf) &&\n      isValidEmail(responsibleEmail) &&\n      isValidPhone(responsiblePhone)\n    );"""
          if old not in text:
              raise SystemExit('responsible validation block not found')
          text = text.replace(old, new, 1)

          old = """    if (minorStatus === true && !responsibleName) {\n      setRegistrationMessage('Complete as informações do responsável legal antes de solicitar a inscrição.');\n      return;\n    }"""
          new = """    if (minorStatus === true && (!responsibleName || !responsibleLegalCapacity)) {\n      setRegistrationMessage('Complete as informações do responsável legal antes de solicitar a inscrição.');\n      return;\n    }"""
          if old in text:
              text = text.replace(old, new, 1)

          old = """                    <p>Eu, <strong>{responsibleName}</strong>, inscrito(a) no CPF nº <strong>{responsibleCpf}</strong>, na qualidade de responsável legal pelo(a) estudante <strong>{athleteName}</strong>, regularmente matriculado(a) na instituição de ensino <strong>{athleteInstitution || '_______________________________'}</strong>, autorizo sua participação voluntária na competição <strong>{selectedCompetition.name}</strong>, a ser realizada no período de <strong>{selectedCompetition.period}</strong>, em <strong>{selectedCompetition.location}</strong>.</p>"""
          new = """                    <p>Eu, <strong>{responsibleName}</strong>, inscrito(a) no CPF nº <strong>{responsibleCpf}</strong>, na condição de <strong>{responsibleCapacityLabel}</strong> e responsável legal pelo(a) estudante <strong>{athleteName}</strong>, regularmente matriculado(a) na instituição de ensino <strong>{athleteInstitution || '_______________________________'}</strong>, autorizo sua participação voluntária na competição <strong>{selectedCompetition.name}</strong>, a ser realizada no período de <strong>{selectedCompetition.period}</strong>, em <strong>{selectedCompetition.location}</strong>.</p>"""
          if old not in text:
              raise SystemExit('term paragraph not found')
          text = text.replace(old, new, 1)

          old = """                            <label>Nome completo<input required value={responsibleName} onChange={(e) => setResponsibleName(e.target.value)} placeholder=\"Nome completo\" /></label>\n                            <label>CPF"""
          new = """                            <label>Nome completo<input required value={responsibleName} onChange={(e) => setResponsibleName(e.target.value)} placeholder=\"Nome completo\" /></label>\n                            <label>Condição do responsável legal\n                              <select\n                                required\n                                value={responsibleLegalCapacity}\n                                onChange={(e) => {\n                                  const next = e.target.value;\n                                  setResponsibleLegalCapacity(next);\n                                  if (next !== 'Outro responsável legal') setResponsibleOtherCapacity('');\n                                  if (!['Tutor(a)', 'Guardião(ã) judicial', 'Outro responsável legal'].includes(next)) setResponsibleProofDocument(null);\n                                }}\n                              >\n                                <option value=\"\" disabled>Selecione</option>\n                                <option>Mãe</option>\n                                <option>Pai</option>\n                                <option>Tutor(a)</option>\n                                <option>Guardião(ã) judicial</option>\n                                <option>Outro responsável legal</option>\n                              </select>\n                              <small className=\"field-help\">Avós, tios e outras pessoas só devem ser indicados quando tiverem condição jurídica de responsável legal.</small>\n                            </label>\n                            {responsibleLegalCapacity === 'Outro responsável legal' && (\n                              <label>Informe a condição ou vínculo\n                                <input required value={responsibleOtherCapacity} onChange={(e) => setResponsibleOtherCapacity(e.target.value)} placeholder=\"Descreva a condição jurídica do responsável\" />\n                              </label>\n                            )}\n                            {responsibleNeedsProof && (\n                              <label>Documento comprobatório da responsabilidade legal\n                                <input\n                                  required\n                                  type=\"file\"\n                                  accept=\".pdf,.jpg,.jpeg,.png\"\n                                  onChange={(e) => setResponsibleProofDocument(e.target.files?.[0] ?? null)}\n                                />\n                                <small className=\"field-help\">Para tutor, guardião judicial ou outro responsável legal, anexe o termo, decisão judicial ou documento equivalente que comprove a representação.</small>\n                                {responsibleProofDocument && <small className=\"field-help\">Arquivo selecionado: {responsibleProofDocument.name}</small>}\n                              </label>\n                            )}\n                            <label>CPF"""
          if old not in text:
              raise SystemExit('guardian form anchor not found')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name "Cristina-parisenti"
          git config user.email "crislu88@hotmail.com"
          git add src/App.tsx
          git commit -m "Add legal guardian relationship and proof rules"
          git push
