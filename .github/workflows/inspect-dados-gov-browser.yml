name: Inspect higher education resource through public portal

on:
  push:
    paths:
      - '.github/workflows/inspect-dados-gov-browser.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Render Dados Abertos dataset page
        run: |
          set +e
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "BROWSER=$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'https://dados.gov.br/dados/conjuntos-dados/sistema-e-mec---cursos-de-graduacao-do-brasil' > /tmp/page.html 2>/tmp/chrome.err
          echo "CHROME_EXIT=$?"
          echo "DOM_SIZE=$(wc -c </tmp/page.html)"
          echo '--- LINKS ---'
          grep -Eo 'https?://[^"<> ]+' /tmp/page.html | grep -Ei 'mec|curso|csv|recurso|download' | head -100
          echo '--- CONTEXT ---'
          grep -Ein 'Acessar o recurso|Cursos de Graduação|csv|29/09/2025|recurso' /tmp/page.html | head -80
          echo '--- ERR ---'
          tail -60 /tmp/chrome.err
          exit 0
