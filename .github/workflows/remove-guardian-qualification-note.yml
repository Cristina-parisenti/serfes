name: Remove guardian qualification helper note

on:
  push:
    paths:
      - '.github/workflows/remove-guardian-qualification-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove note below qualification field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          target = '                              <small className="field-help">Avós, tios e outras pessoas só devem ser indicados quando tiverem condição jurídica de responsável legal.</small>\n'
          if target not in text:
              raise SystemExit('Target helper note not found')
          text = text.replace(target, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate build
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name "SERFES UI Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Remove guardian qualification helper note"
          git pull --rebase origin main
          git push origin main
