name: Simplificar identificação dos cursos superiores

on:
  push:
    paths:
      - '.github/workflows/simplify-higher-course-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simplificar opções exibidas ao aluno
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old_options = """  const higherCourseOptions = (higherEducation?.courses ?? [])
    .filter((course) => selectedHigherInstitution !== null && course.institutionId === selectedHigherInstitution.id)
    .sort((a, b) => higherEducationCourseLabel(a).localeCompare(higherEducationCourseLabel(b), 'pt-BR'));
"""
          new_options = """  const higherCourseOptions = Array.from(
    new Map(
      (higherEducation?.courses ?? [])
        .filter((course) => selectedHigherInstitution !== null && course.institutionId === selectedHigherInstitution.id)
        .map((course) => [normalizeEducationText(higherEducationCourseLabel(course)), course] as const),
    ).values(),
  ).sort((a, b) => higherEducationCourseLabel(a).localeCompare(higherEducationCourseLabel(b), 'pt-BR'));
"""
          if new_options not in text:
              if old_options not in text:
                  raise SystemExit('Bloco de opções de cursos não localizado.')
              text = text.replace(old_options, new_options, 1)

          old_help = """                              <small className=\"field-help\">São exibidos somente cursos oficiais vinculados à instituição selecionada e com oferta localizada no Paraná. Quando disponíveis na base oficial, o grau, a modalidade e o código e-MEC identificam cada oferta.</small>
"""
          new_help = """                              <small className=\"field-help\">São exibidos somente cursos oficiais vinculados à instituição selecionada e com oferta localizada no Paraná. O nome e, quando aplicável, o grau acadêmico são apresentados ao aluno; os demais identificadores oficiais permanecem apenas no catálogo interno do SERFES.</small>
"""
          if new_help not in text:
              if old_help not in text:
                  raise SystemExit('Texto auxiliar do campo Curso não localizado.')
              text = text.replace(old_help, new_help, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validar aplicação
        run: |
          npm install
          npm run build
      - name: Publicar ajuste
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "Ajuste já aplicado."
            exit 0
          fi
          git config user.name "SERFES UI Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Simplificar exibição dos cursos superiores"
          git pull --rebase origin main
          git push origin main
