name: Refine guardian legal qualification

on:
  push:
    paths:
      - '.github/workflows/refine-guardian-qualification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refine guardian qualification options
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')

          replacements = [
            ("  const [responsibleOtherCapacity, setResponsibleOtherCapacity] = useState('');\n", ""),
            ("  const responsibleNeedsProof = ['Tutor(a)', 'Guardião(ã) judicial', 'Outro responsável legal'].includes(responsibleLegalCapacity);\n  const responsibleCapacityLabel = responsibleLegalCapacity === 'Outro responsável legal'\n    ? responsibleOtherCapacity.trim() || 'Outro responsável legal'\n    : responsibleLegalCapacity;",
             "  const responsibleNeedsProof = ['Tutor(a)', 'Guardião(ã)'].includes(responsibleLegalCapacity);\n  const responsibleCapacityLabel = responsibleLegalCapacity;"),
            ("      (responsibleLegalCapacity !== 'Outro responsável legal' || responsibleOtherCapacity.trim().length > 0) &&\n", ""),
            ("                            <label>Condição do responsável legal", "                            <label>Qualificação do responsável legal"),
            ("                                  if (next !== 'Outro responsável legal') setResponsibleOtherCapacity('');\n", ""),
            ("                                  if (!['Tutor(a)', 'Guardião(ã) judicial', 'Outro responsável legal'].includes(next)) setResponsibleProofDocument(null);",
             "                                  if (!['Tutor(a)', 'Guardião(ã)'].includes(next)) setResponsibleProofDocument(null);"),
            ("                                <option>Guardião(ã) judicial</option>\n                                <option>Outro responsável legal</option>",
             "                                <option>Guardião(ã)</option>"),
            ("                            {responsibleLegalCapacity === 'Outro responsável legal' && (\n                              <label>Informe a condição ou vínculo\n                                <input required value={responsibleOtherCapacity} onChange={(e) => setResponsibleOtherCapacity(e.target.value)} placeholder=\"Descreva a condição jurídica do responsável\" />\n                              </label>\n                            )}\n", ""),
            ("Para tutor, guardião judicial ou outro responsável legal, anexe o termo, decisão judicial ou documento equivalente que comprove a representação.",
             "Para tutor ou guardião, anexe o termo, decisão judicial ou documento equivalente que comprove a representação."),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:80]}')
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name "Cristina-parisenti"
          git config user.email "crislu88@hotmail.com"
          git add src/App.tsx
          git commit -m "Use legal guardian qualification without other option"
          git push
