name: Rename guardian qualification label

on:
  push:
    paths:
      - '.github/workflows/rename-guardian-qualification-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rename label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          target = '<label>Qualificação do responsável legal\n'
          replacement = '<label>Qualificação\n'
          if target not in text:
              raise SystemExit('Target label not found')
          path.write_text(text.replace(target, replacement, 1), encoding='utf-8')
          PY
      - name: Validate build
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name "SERFES UI Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Shorten guardian qualification label"
          git pull --rebase origin main
          git push origin main
