name: Sincronizar ensino superior

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: higher-education-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sincronizar dados oficiais do MEC
        run: python scripts/sync_higher_education.py

      - name: Publicar catálogo atualizado
        run: |
          if git diff --quiet -- public/higher-education.json; then
            echo "Nenhuma alteração no catálogo do ensino superior."
            exit 0
          fi
          git config user.name "SERFES Higher Education Sync"
          git config user.email "actions@users.noreply.github.com"
          git add public/higher-education.json
          git commit -m "Atualizar catálogo oficial do ensino superior"
          git pull --rebase origin main
          git push origin main
