name: Sincronizar ensino superior

on:
  workflow_dispatch:
  schedule:
    - cron: '35 11 * * *'
  push:
    paths:
      - 'scripts/sync_higher_education.py'
      - '.github/workflows/sync-higher-education.yml'

permissions:
  contents: write

concurrency:
  group: higher-education-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sincronizar dados oficiais do MEC/SERES e Inep para o Paraná
        id: official_sync
        continue-on-error: true
        run: python scripts/sync_higher_education.py

      - name: Registrar indisponibilidade temporária da fonte
        if: steps.official_sync.outcome == 'failure'
        run: |
          echo "::warning::As fontes oficiais de ensino superior estão temporariamente indisponíveis. O catálogo existente foi preservado e uma nova tentativa ocorrerá automaticamente."

      - name: Publicar catálogo atualizado
        if: steps.official_sync.outcome == 'success'
        run: |
          if git diff --quiet -- public/higher-education.json; then
            echo "Nenhuma alteração no catálogo do ensino superior."
            exit 0
          fi
          git config user.name "SERFES Higher Education Sync"
          git config user.email "actions@users.noreply.github.com"
          git add public/higher-education.json
          git commit -m "Atualizar catálogo oficial do ensino superior do Paraná"
          git pull --rebase origin main
          git push origin main
