name: Refinar página inicial e aviso do atleta

on:
  push:
    paths:
      - '.github/workflows/refine-athlete-home-notice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ajustar página inicial do atleta
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          old_notice = '''                {!athleteHomeNoticeDismissed && (\n                  <aside className="athlete-next-step-notice" role="status" aria-live="polite">\n                    <button type="button" className="athlete-notice-close" aria-label="Fechar recado" onClick={() => setAthleteHomeNoticeDismissed(true)}>×</button>\n                    <span className="athlete-notice-kicker">Próxima etapa</span>\n                    {!athleteSaved ? (\n                      <>\n                        <strong>Preencha seu cadastro</strong>\n                        <p>Complete os dados necessários para utilizar as funcionalidades do SERFES.</p>\n                        <button type="button" className="athlete-notice-action" onClick={() => { setAthleteHomeNoticeDismissed(true); setDashboardSection('athleteForm'); }}>Preencher cadastro</button>\n                      </>\n                    ) : enrollmentStatus === 'Sim' && !schoolConfirmationCurrent ? (\n                      <>\n                        <strong>Atualize seu vínculo escolar</strong>\n                        <p>O ano letivo mudou. Atualize instituição, ano escolar ou curso antes de solicitar novas inscrições.</p>\n                        <button type="button" className="athlete-notice-action" onClick={() => { setAthleteHomeNoticeDismissed(true); setDashboardSection('athleteForm'); }}>Atualizar vínculo</button>\n                      </>\n                    ) : (\n                      <>\n                        <strong>Consulte as competições</strong>\n                        <p>Seu cadastro está pronto para a próxima etapa. Veja as competições disponíveis e solicite sua inscrição.</p>\n                        <button type="button" className="athlete-notice-action" onClick={() => { setAthleteHomeNoticeDismissed(true); setDashboardSection('athleteCompetitions'); }}>Ver competições</button>\n                      </>\n                    )}\n                  </aside>\n                )}\n'''

          new_notice = '''                {athleteSaved && !athleteHomeNoticeDismissed && (\n                  <aside className="athlete-next-step-notice" role="alertdialog" aria-live="polite" aria-label="Próxima etapa">\n                    <button type="button" className="athlete-notice-close" aria-label="Fechar aviso" onClick={() => setAthleteHomeNoticeDismissed(true)}>×</button>\n                    <span className="athlete-notice-kicker">Próxima etapa</span>\n                    {enrollmentStatus === 'Sim' && !schoolConfirmationCurrent ? (\n                      <>\n                        <strong>Atualize seu vínculo escolar</strong>\n                        <p>O ano letivo mudou. Atualize instituição, ano escolar ou curso antes de solicitar novas inscrições.</p>\n                        <button type="button" className="athlete-notice-action" onClick={() => { setAthleteHomeNoticeDismissed(true); setDashboardSection('athleteForm'); }}>Atualizar vínculo</button>\n                      </>\n                    ) : (\n                      <>\n                        <strong>Cadastro concluído</strong>\n                        <p>Agora você pode consultar as competições disponíveis e solicitar sua inscrição.</p>\n                        <button type="button" className="athlete-notice-action" onClick={() => { setAthleteHomeNoticeDismissed(true); setDashboardSection('athleteCompetitions'); }}>Consultar competições</button>\n                      </>\n                    )}\n                  </aside>\n                )}\n'''

          if old_notice not in text:
              raise SystemExit('Aviso atual não localizado.')
          text = text.replace(old_notice, new_notice, 1)

          old_hero = '''                  <div className="athlete-home-hero-copy">\n                    <span className="pill">Minha área</span>\n                    <h3>Bem-vindo ao seu espaço no SERFES</h3>\n                    <p>Complete o cadastro e acompanhe informações relacionadas ao seu perfil.</p>\n                  </div>\n'''
          new_hero = '''                  <div className="athlete-home-hero-copy">\n                    <span className="pill">Minha área</span>\n                    <h3>Bem-vindo ao seu espaço no SERFES</h3>\n                  </div>\n'''
          if old_hero not in text:
              raise SystemExit('Texto principal não localizado.')
          text = text.replace(old_hero, new_hero, 1)

          app.write_text(text, encoding='utf-8')

          css = Path('src/athleteHome.css')
          styles = css.read_text(encoding='utf-8')
          styles = styles.replace(
              ".athlete-home-hero-copy { position: relative; z-index: 1; max-width: 690px; }\n",
              ".athlete-home-hero-copy { position: relative; z-index: 1; max-width: none; flex: 1; }\n",
              1,
          )
          styles = styles.replace(
              ".athlete-home-hero h3 { margin: .75rem 0 .55rem; font-size: clamp(1.8rem, 3vw, 2.65rem); color: #fff; }\n.athlete-home-hero p { margin: 0; max-width: 620px; font-size: 1.03rem; line-height: 1.65; color: rgba(255,255,255,.88); }\n",
              ".athlete-home-hero h3 { margin: .75rem 0 0; font-size: clamp(1.7rem, 2.5vw, 2.35rem); color: #fff; white-space: nowrap; }\n",
              1,
          )

          old_box = '''.athlete-next-step-notice {\n  position: fixed;\n  right: 24px;\n  bottom: 24px;\n  z-index: 80;\n  width: min(390px, calc(100vw - 40px));\n  display: grid;\n  gap: .45rem;\n  padding: 1.15rem 3rem 1.15rem 1.2rem;\n  border: 1px solid #c7ddec;\n  border-radius: 20px;\n  background: rgba(255,255,255,.98);\n  box-shadow: 0 18px 48px rgba(20,59,99,.22);\n  backdrop-filter: blur(10px);\n}\n'''
          new_box = '''.athlete-next-step-notice {\n  position: fixed;\n  left: 50%;\n  top: 50%;\n  transform: translate(-50%, -50%);\n  z-index: 100;\n  width: min(460px, calc(100vw - 40px));\n  display: grid;\n  gap: .55rem;\n  padding: 1.45rem 3.2rem 1.45rem 1.5rem;\n  border: 1px solid #b9d3e7;\n  border-radius: 22px;\n  background: rgba(255,255,255,.99);\n  box-shadow: 0 24px 70px rgba(20,59,99,.28);\n  backdrop-filter: blur(12px);\n}\n'''
          if old_box not in styles:
              raise SystemExit('Estilo do aviso não localizado.')
          styles = styles.replace(old_box, new_box, 1)
          styles = styles.replace(
              "  .athlete-home-hero-symbol { display: none; }\n",
              "  .athlete-home-hero-symbol { display: none; }\n  .athlete-home-hero h3 { white-space: normal; }\n",
              1,
          )
          styles = styles.replace(
              "  .athlete-next-step-notice { right: 20px; bottom: 20px; }\n",
              "  .athlete-next-step-notice { width: calc(100vw - 32px); }\n",
              1,
          )
          css.write_text(styles, encoding='utf-8')
          PY

      - name: Validar aplicação
        run: |
          npm install
          npm run build

      - name: Publicar ajustes
        run: |
          git config user.name "SERFES UI Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/athleteHome.css
          git commit -m "Refinar aviso e destaque da página inicial do atleta"
          git pull --rebase origin main
          git push origin main
