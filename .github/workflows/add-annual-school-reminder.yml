name: Add annual school confirmation reminder

on:
  push:
    paths:
      - '.github/workflows/add-annual-school-reminder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add annual school reminder
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """                {athleteSaved && <div className=\"success-banner\"><CheckCircle2 size={19} /><div><strong>Seu cadastro demonstrativo foi salvo.</strong><span>Agora você pode consultar as competições disponíveis.</span></div></div>}\n"""
          new = """                {athleteSaved && enrollmentStatus === 'Sim' && !schoolConfirmationCurrent && (\n                  <div className=\"warning-note\">\n                    <AlertTriangle size={18} />\n                    <div>\n                      <strong>Atualize seu vínculo escolar para {schoolReferenceYear}</strong>\n                      <span>Para manter seu cadastro escolar válido no novo ano letivo, confirme novamente a instituição e o ano escolar/curso atuais.</span>\n                    </div>\n                    <button type=\"button\" className=\"secondary-button compact-button\" onClick={() => setDashboardSection('athleteForm')}>Atualizar agora</button>\n                  </div>\n                )}\n                {athleteSaved && <div className=\"success-banner\"><CheckCircle2 size={19} /><div><strong>Seu cadastro demonstrativo foi salvo.</strong><span>Agora você pode consultar as competições disponíveis.</span></div></div>}\n"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Bloco da página inicial do atleta não localizado.')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate build
        run: |
          npm install
          npm run build

      - name: Commit changes
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "Lembrete anual já aplicado."
            exit 0
          fi
          git config user.name "SERFES UI Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Adicionar aviso anual de atualização escolar"
          git pull --rebase origin main
          git push origin main
