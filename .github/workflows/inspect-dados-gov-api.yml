name: Inspect e-MEC catalog

on:
  push:
    paths:
      - '.github/workflows/inspect-dados-gov-api.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public search page
        run: |
          python - <<'PY'
          import re, urllib.request
          urls=[
            'https://emec.mec.gov.br/emec/nova-index/',
            'http://emec.mec.gov.br/emec/nova-index/',
          ]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*','Referer':'https://www.gov.br/'})
                  with urllib.request.urlopen(req,timeout=40) as r:
                      html=r.read().decode('utf-8','replace')
                      print('URL',url,'STATUS',r.status,'FINAL',r.geturl(),'BYTES',len(html))
                  for needle in ['curso','ies','uf','municip','consulta-avancada','ajax','select']:
                      print('\n###',needle)
                      for m in list(re.finditer(needle,html,re.I))[:12]:
                          print(re.sub(r'\s+',' ',html[max(0,m.start()-250):min(len(html),m.end()+650)]))
                  break
              except Exception as exc:
                  print('ERR',url,exc)
          PY
