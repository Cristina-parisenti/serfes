name: Inspect public e-MEC query interface

on:
  push:
    paths:
      - '.github/workflows/inspect-emec-public.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public HTML and scripts
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://emec.mec.gov.br/emec/nova-index/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            html=r.read().decode('utf-8','replace')
            print('STATUS',r.status,'LEN',len(html),'URL',r.geturl())
          for line in html.splitlines():
            low=line.lower()
            if any(x in low for x in ['form','script','consulta','avanc','curso','ajax']):
              print(line[:1200])
          print('SCRIPTS')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
            print(src)
          print('FORMS')
          for form in re.findall(r'<form.*?</form>',html,re.I|re.S):
            print(form[:8000])
          PY
