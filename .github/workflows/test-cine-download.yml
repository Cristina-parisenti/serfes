name: Test Cine Brasil download

on:
  push:
    paths:
      - '.github/workflows/test-cine-download.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download with current CA bundle
        run: |
          python -m pip install --quiet --upgrade requests certifi
          python - <<'PY'
          import requests, certifi, zipfile, io
          url='https://download.inep.gov.br/pesquisas_estatisticas_indicadores_educacionais/cinebrasil/documentos/estrutura_cine_brasil_2026.xlsx'
          print('CA', certifi.where())
          r=requests.get(url,timeout=60,headers={'User-Agent':'Mozilla/5.0'},verify=certifi.where())
          print('STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
          r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          print('XLSX files',len(z.namelist()),z.namelist()[:10])
          PY
