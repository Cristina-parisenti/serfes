name: Extract official higher education resource URL

on:
  push:
    paths:
      - '.github/workflows/extract-higher-ed-resource-url.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Capture institution dataset resources from public browser session
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          slug='sistema-e-mec---instituicoes-de-educacao-superior-do-brasil'
          page_url=f'https://dados.gov.br/dados/conjuntos-dados/{slug}'
          api_tail=f'/api/publico/conjuntos-dados/{slug}'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.set_capability('goog:loggingPrefs', {'performance': 'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
              driver.execute_cdp_cmd('Network.enable', {})
              driver.get(page_url)
              WebDriverWait(driver,30).until(EC.presence_of_element_located((By.ID,'btnDownloadUrl')))
              time.sleep(2)
              for entry in driver.get_log('performance'):
                  msg=json.loads(entry['message'])['message']
                  if msg.get('method')!='Network.responseReceived': continue
                  response=msg.get('params',{}).get('response',{})
                  url=response.get('url','')
                  if api_tail not in url: continue
                  request_id=msg.get('params',{}).get('requestId')
                  print('RESPONSE',response.get('status'),response.get('mimeType'),url)
                  try:
                      body=driver.execute_cdp_cmd('Network.getResponseBody', {'requestId': request_id}).get('body','')
                      data=json.loads(body)
                      print('DATASET',data.get('id'),data.get('title'))
                      print('RESOURCES',json.dumps(data.get('resources'),ensure_ascii=False,indent=2)[:60000])
                  except Exception as exc:
                      print('BODY_ERROR',repr(exc))
          finally:
              driver.quit()
          PY
