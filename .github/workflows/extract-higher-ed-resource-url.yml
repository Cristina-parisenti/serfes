name: Extract official higher education resource URL

on:
  push:
    paths:
      - '.github/workflows/extract-higher-ed-resource-url.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect SERES OData service with browser
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time

          urls=[
            'https://olinda.mec.gov.br/olinda-ide/servico/PDA_SERES/versao/v1/odata/',
            'https://olinda.mec.gov.br/olinda-ide/servico/PDA_SERES/versao/v1/odata/$metadata',
            'https://olinda.mec.gov.br/olinda-ide/servico/PDA_SERES/versao/v1/odata/PDA_Lista_Instituicoes_Ensino_Superior_do_Brasil_EMEC?$format=json&$top=3',
          ]
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          driver=webdriver.Chrome(options=opts)
          try:
            for url in urls:
              print('\nURL',url)
              driver.get(url)
              time.sleep(4)
              print('CURRENT',driver.current_url)
              print('TITLE',driver.title)
              source=driver.page_source
              print('SOURCE_LEN',len(source))
              print(source[:80000])
          finally:
            driver.quit()
          PY
