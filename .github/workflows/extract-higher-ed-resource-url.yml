name: Extract official higher education resource URL

on:
  push:
    paths:
      - '.github/workflows/extract-higher-ed-resource-url.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect e-MEC public search in browser
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time, re

          url='https://emec.mec.gov.br/emec/nova-index/'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          driver=webdriver.Chrome(options=opts)
          try:
            driver.get(url)
            time.sleep(8)
            print('CURRENT',driver.current_url)
            print('TITLE',driver.title)
            print('TEXT',driver.find_element('tag name','body').text[:25000])
            source=driver.page_source
            print('SOURCE_LEN',len(source))
            print('FORMS')
            for block in re.findall(r'<form.*?</form>',source,re.I|re.S):
              print(block[:30000])
            print('INPUTS/SELECTS')
            for el in driver.find_elements('css selector','input,select,button,a')[:500]:
              try:
                print(el.tag_name, el.get_attribute('id'), el.get_attribute('name'), el.get_attribute('value'), el.text[:120], el.get_attribute('href'))
              except Exception: pass
          finally:
            driver.quit()
          PY
