name: Extract official higher education resource URL

on:
  push:
    paths:
      - '.github/workflows/extract-higher-ed-resource-url.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Capture dataset response from public browser session
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          page_url='https://dados.gov.br/dados/conjuntos-dados/sistema-e-mec---cursos-de-graduacao-do-brasil'
          api_tail='/api/publico/conjuntos-dados/sistema-e-mec---cursos-de-graduacao-do-brasil'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.set_capability('goog:loggingPrefs', {'performance': 'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
              driver.execute_cdp_cmd('Network.enable', {})
              driver.get(page_url)
              WebDriverWait(driver,30).until(EC.presence_of_element_located((By.ID,'btnDownloadUrl')))
              time.sleep(2)
              logs=driver.get_log('performance')
              matches=[]
              for entry in logs:
                  msg=json.loads(entry['message'])['message']
                  if msg.get('method')!='Network.responseReceived':
                      continue
                  response=msg.get('params',{}).get('response',{})
                  url=response.get('url','')
                  if api_tail in url:
                      matches.append((msg.get('params',{}).get('requestId'),url,response.get('status'),response.get('mimeType')))
              print('MATCHES',matches)
              for request_id,url,status,mime in matches:
                  print('RESPONSE',status,mime,url)
                  try:
                      body=driver.execute_cdp_cmd('Network.getResponseBody', {'requestId': request_id}).get('body','')
                      print('BODY_LEN',len(body))
                      print(body[:120000])
                      data=json.loads(body)
                      if isinstance(data,dict):
                          print('KEYS',sorted(data.keys()))
                          def walk(obj,path='root'):
                              if isinstance(obj,dict):
                                  for k,v in obj.items():
                                      p=f'{path}.{k}'
                                      if any(t in k.lower() for t in ('recurso','resource','url','link','arquivo','file')):
                                          print('CANDIDATE',p,json.dumps(v,ensure_ascii=False)[:30000])
                                      walk(v,p)
                              elif isinstance(obj,list):
                                  for i,v in enumerate(obj[:20]): walk(v,f'{path}[{i}]')
                          walk(data)
                  except Exception as exc:
                      print('BODY_ERROR',repr(exc))
          finally:
              driver.quit()
          PY
