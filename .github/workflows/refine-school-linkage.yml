name: Refine school linkage and annual confirmation

on:
  push:
    paths:
      - '.github/workflows/refine-school-linkage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update athlete school linkage flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          def ensure_replace(old, new, label):
              global text
              if new in text:
                  print(f'{label}: already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected block not found')
              text = text.replace(old, new, 1)
              print(f'{label}: applied')

          ensure_replace(
              "  const [higherEducationCourse, setHigherEducationCourse] = useState('');\n",
              "  const [higherEducationCourse, setHigherEducationCourse] = useState('');\n  const [schoolAnnualConfirmation, setSchoolAnnualConfirmation] = useState(false);\n  const [schoolConfirmedYear, setSchoolConfirmedYear] = useState<number | null>(null);\n",
              'annual confirmation state',
          )

          ensure_replace(
              "  const minorStatus = athleteAge === null ? null : athleteAge < 18;\n",
              "  const minorStatus = athleteAge === null ? null : athleteAge < 18;\n  const schoolReferenceYear = ageReferenceDate.getFullYear();\n  const schoolConfirmationCurrent = enrollmentStatus !== 'Sim' || schoolConfirmedYear === schoolReferenceYear;\n",
              'annual confirmation derived values',
          )

          ensure_replace(
              "      setAthleteInstitution('');\n    }\n  }, [athleteAge, schoolLevel]);\n",
              "      setAthleteInstitution('');\n      setSchoolAnnualConfirmation(false);\n      setSchoolConfirmedYear(null);\n    }\n  }, [athleteAge, schoolLevel]);\n\n  useEffect(() => {\n    if (schoolConfirmedYear !== null && schoolConfirmedYear !== schoolReferenceYear) {\n      setSchoolAnnualConfirmation(false);\n    }\n  }, [schoolConfirmedYear, schoolReferenceYear]);\n",
              'annual rollover reset',
          )

          ensure_replace(
              "      (!schoolYearRequired || schoolYear.length > 0) &&\n      (!higherCourseRequired || higherEducationCourse.trim().length > 0)\n",
              "      (!schoolYearRequired || schoolYear.length > 0) &&\n      (!higherCourseRequired || higherEducationCourse.trim().length > 0) &&\n      schoolAnnualConfirmation\n",
              'annual confirmation required',
          )

          ensure_replace(
              "    setAthleteSaved(true);\n",
              "    setSchoolConfirmedYear(enrollmentStatus === 'Sim' ? schoolReferenceYear : null);\n    setAthleteSaved(true);\n",
              'save annual confirmation year',
          )

          ensure_replace(
              "    if (!athleteSaved) {\n      setRegistrationMessage('Antes da inscrição em uma competição, complete e salve o seu cadastro.');\n      return;\n    }\n\n    const competition = competitions.find((item) => item.id === competitionId);\n",
              "    if (!athleteSaved) {\n      setRegistrationMessage('Antes da inscrição em uma competição, complete e salve o seu cadastro.');\n      return;\n    }\n\n    if (enrollmentStatus === 'Sim' && schoolConfirmedYear !== schoolReferenceYear) {\n      setRegistrationMessage(`Antes da inscrição, confirme novamente seu vínculo escolar referente ao ano letivo de ${schoolReferenceYear}.`);\n      return;\n    }\n\n    const competition = competitions.find((item) => item.id === competitionId);\n",
              'block registration when annual school confirmation is stale',
          )

          ensure_replace(
              "                  <article className=\"mini-status green\"><strong>{athleteInstitution ? 'Informado' : '—'}</strong><span>Vínculo escolar</span></article>\n",
              "                  <article className=\"mini-status green\"><strong>{athleteInstitution ? (schoolConfirmationCurrent ? `Confirmado ${schoolReferenceYear}` : 'Reconfirmação pendente') : '—'}</strong><span>Vínculo escolar</span></article>\n",
              'school status summary',
          )

          reset_pairs = [
              ("                              if (nextValue !== 'Sim') {\n", "                              setSchoolAnnualConfirmation(false);\n                              setSchoolConfirmedYear(null);\n                              if (nextValue !== 'Sim') {\n", 'enrollment reset'),
              ("                                setSchoolMunicipality(e.target.value);\n                                setSchoolNetwork('');\n", "                                setSchoolMunicipality(e.target.value);\n                                setSchoolAnnualConfirmation(false);\n                                setSchoolConfirmedYear(null);\n                                setSchoolNetwork('');\n", 'municipality reset'),
              ("                                setSchoolNetwork(e.target.value);\n                                setAthleteInstitution('');\n", "                                setSchoolNetwork(e.target.value);\n                                setSchoolAnnualConfirmation(false);\n                                setSchoolConfirmedYear(null);\n                                setAthleteInstitution('');\n", 'network reset'),
              ("                                setSchoolLevel(e.target.value);\n                                setSchoolYear('');\n", "                                setSchoolLevel(e.target.value);\n                                setSchoolAnnualConfirmation(false);\n                                setSchoolConfirmedYear(null);\n                                setSchoolYear('');\n", 'level reset'),
              ("                                onChange={(e) => { setAthleteInstitution(e.target.value); setHigherEducationCourse(''); }}\n", "                                onChange={(e) => { setAthleteInstitution(e.target.value); setHigherEducationCourse(''); setSchoolAnnualConfirmation(false); setSchoolConfirmedYear(null); }}\n", 'institution reset'),
              ("                              <select required value={schoolYear} onChange={(e) => setSchoolYear(e.target.value)}>\n", "                              <select required value={schoolYear} onChange={(e) => { setSchoolYear(e.target.value); setSchoolAnnualConfirmation(false); setSchoolConfirmedYear(null); }}>\n", 'school year reset'),
              ("                                onChange={(e) => setHigherEducationCourse(e.target.value)}\n", "                                onChange={(e) => { setHigherEducationCourse(e.target.value); setSchoolAnnualConfirmation(false); setSchoolConfirmedYear(null); }}\n", 'course reset'),
          ]
          for old, new, label in reset_pairs:
              ensure_replace(old, new, label)

          old_source = """                          )}
                        </div>
                        <div className=\"form-actions source-actions\">
                          {schoolLevel === 'Ensino superior' ? (
                            <a className=\"secondary-button\" href={higherEducation?.sourceUrl || 'https://emec.mec.gov.br/emec/nova-index/'} target=\"_blank\" rel=\"noreferrer\">Consultar cadastro oficial e-MEC</a>
                          ) : (
                            <a className=\"secondary-button\" href={schoolDirectory?.sourceUrl || 'https://www.consultaescolas.pr.gov.br/consultaescolas/pages/templates/initial2.xhtml'} target=\"_blank\" rel=\"noreferrer\">Consultar base oficial da SEED/PR</a>
                          )}
                        </div>
"""
          new_source = """                          )}
                          {enrollmentStatus === 'Sim' && (
                            <div className=\"annual-school-confirmation\">
                              <div className=\"annual-school-confirmation-head\">
                                <strong>Confirmação anual do vínculo escolar</strong>
                                <span>Ano letivo {schoolReferenceYear}</span>
                              </div>
                              <label className=\"annual-school-checkbox\">
                                <input
                                  required
                                  type=\"checkbox\"
                                  checked={schoolAnnualConfirmation}
                                  onChange={(e) => setSchoolAnnualConfirmation(e.target.checked)}
                                />
                                <span>Confirmo que, no ano letivo de {schoolReferenceYear}, a instituição e o ano escolar/curso informados acima correspondem à minha matrícula atual.</span>
                              </label>
                              <small className=\"field-help\">Esta confirmação será solicitada novamente no início de cada ano. Se houver mudança de escola, instituição, ano escolar ou curso, será necessário atualizar e salvar o cadastro.</small>
                              {schoolConfirmedYear === schoolReferenceYear && <small className=\"annual-school-confirmed\">Vínculo confirmado para {schoolReferenceYear}.</small>}
                            </div>
                          )}
                        </div>
                        {schoolLevel === 'Ensino superior' && (
                          <div className=\"form-actions source-actions\">
                            <a className=\"secondary-button\" href={higherEducation?.sourceUrl || 'https://emec.mec.gov.br/emec/nova-index/'} target=\"_blank\" rel=\"noreferrer\">Consultar cadastro oficial e-MEC</a>
                          </div>
                        )}
"""
          ensure_replace(old_source, new_source, 'annual confirmation UI and remove SEED button')

          old_docs = """                          <div className=\"document-item\"><FileText size={18} /><div><strong>Documento de identificação</strong><span>Não anexado</span></div></div>
                          <div className=\"document-item\"><FileText size={18} /><div><strong>Comprovante de vínculo escolar</strong><span>Não anexado</span></div></div>
                          <div className=\"document-item\"><FileSignature size={18} /><div><strong>Autorizações por competição</strong><span>{minorStatus === true ? 'Geradas no momento da inscrição' : 'Não se aplica'}</span></div></div>
                        </div>
                        <p className=\"prototype-note\">Cada competição poderá possuir uma autorização própria, vinculada à respectiva solicitação de inscrição.</p>
"""
          new_docs = """                          <div className=\"document-item\"><FileText size={18} /><div><strong>Documento de identificação do aluno</strong><span>Não anexado</span></div></div>
                          <div className=\"document-item\"><FileText size={18} /><div><strong>Comprovante de vínculo escolar</strong><span>Não anexado</span></div></div>
                        </div>
"""
          ensure_replace(old_docs, new_docs, 'documents section')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate build
        run: |
          npm install
          npm run build

      - name: Commit changes
        run: |
          git config user.name "SERFES UI Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No App changes to commit."
            exit 0
          fi
          git commit -m "Refinar vínculo escolar e confirmação anual"
          git pull --rebase origin main
          git push origin main
