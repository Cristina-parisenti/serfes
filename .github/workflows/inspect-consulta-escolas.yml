name: Inspect Consulta Escolas

on:
  push:
    paths:
      - '.github/workflows/inspect-consulta-escolas.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test official school filters
        run: |
          python - <<'PY'
          import html as htmlmod
          import http.cookiejar
          import re
          import urllib.parse
          import urllib.request

          base='https://www.consultaescolas.pr.gov.br/consultaescolas/pages/templates/initial2.xhtml'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0'})
          with opener.open(req,timeout=40) as r:
              page=r.read().decode('utf-8','replace')
              action=r.geturl()
          vs=re.findall(r'name="javax.faces.ViewState"[^>]+value="([^"]+)"',page)[-1]
          print('action',action)
          print('viewstate',vs)

          for rede,label in [('1','Federal'),('2','Estadual'),('3','Municipal'),('4','Privada')]:
              data={
                  'javax.faces.partial.ajax':'true',
                  'javax.faces.source':'initial:j_idt80:redeEnsino',
                  'javax.faces.partial.execute':'initial:j_idt80:municipio initial:j_idt80:redeEnsino',
                  'javax.faces.partial.render':'initial:j_idt80:escola',
                  'javax.faces.behavior.event':'change',
                  'javax.faces.partial.event':'change',
                  'initial:j_idt80:redeEnsino':'initial:j_idt80:redeEnsino',
                  'initial:j_idt80:municipio_input':'690',
                  'initial:j_idt80:redeEnsino_input':rede,
                  'javax.faces.ViewState':vs,
              }
              body=urllib.parse.urlencode(data).encode()
              post=urllib.request.Request(action,data=body,headers={
                  'User-Agent':'Mozilla/5.0',
                  'Faces-Request':'partial/ajax',
                  'X-Requested-With':'XMLHttpRequest',
                  'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
              })
              with opener.open(post,timeout=40) as r:
                  partial=r.read().decode('utf-8','replace')
              decoded=htmlmod.unescape(partial)
              opts=re.findall(r'<option(?:[^>]*)value="([^"]*)"[^>]*>(.*?)</option>',decoded,re.I|re.S)
              opts=[(v,re.sub(r'<[^>]+>','',t).strip()) for v,t in opts if re.sub(r'<[^>]+>','',t).strip() not in ('Selecione...','')]
              print('\n',label,'count',len(opts),'first',opts[:12])
              nvs=re.search(r'<update id="javax.faces.ViewState"><!\[CDATA\[(.*?)\]\]></update>',partial,re.S)
              if nvs: vs=nvs.group(1)
          PY
