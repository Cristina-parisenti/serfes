name: Inspect Consulta Escolas

on:
  push:
    paths:
      - '.github/workflows/inspect-consulta-escolas.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official page
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.consultaescolas.pr.gov.br/consultaescolas/pages/templates/initial2.xhtml'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              html=r.read().decode('utf-8','replace')
          print('bytes',len(html))
          for pattern in ['javax.faces.ViewState','Rede de Ensino','codigoMunicipio','codigoEstab','rede','escola','form']:
              print('\n###',pattern)
              for m in list(re.finditer(pattern,html,re.I))[:10]:
                  a=max(0,m.start()-260); b=min(len(html),m.end()+500)
                  print(re.sub(r'\s+',' ',html[a:b]))
          PY
