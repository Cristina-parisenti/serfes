name: Inspect Consulta Escolas

on:
  push:
    paths:
      - '.github/workflows/inspect-consulta-escolas.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official page
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.consultaescolas.pr.gov.br/consultaescolas/pages/templates/initial2.xhtml'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              html=r.read().decode('utf-8','replace')
          print('bytes',len(html))
          for ident in ['municipio_input','redeEnsino_input','escola_input']:
              print('\n###',ident)
              m=re.search(r'<select[^>]+id="[^"]*'+re.escape(ident)+r'".*?</select>',html,re.I|re.S)
              if m: print(re.sub(r'\s+',' ',m.group(0)))
              else: print('not found')
          print('\n### ajax scripts')
          for m in re.finditer(r'PrimeFaces\.ab\([^;]{0,900}',html,re.I):
              s=m.group(0)
              if 'municipio' in s or 'redeEnsino' in s or 'escola' in s:
                  print(re.sub(r'\s+',' ',s))
          PY
