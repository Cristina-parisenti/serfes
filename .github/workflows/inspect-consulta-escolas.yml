name: Inspect MEC resources

on:
  push:
    paths:
      - '.github/workflows/inspect-consulta-escolas.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Dados.gov resource links
        run: |
          python - <<'PY'
          import re, urllib.request
          pages=[
            'https://dados.gov.br/dados/conjuntos-dados/sistema-e-mec---instituicoes-de-educacao-superior-do-brasil',
            'https://dados.gov.br/dados/conjuntos-dados/sistema-e-mec---cursos-de-graduacao-do-brasil',
          ]
          for url in pages:
              print('\n### PAGE',url)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=50) as r:
                  html=r.read().decode('utf-8','replace')
              print('bytes',len(html))
              links=sorted(set(re.findall(r'https?://[^"\'<>\\ ]+',html)))
              for link in links:
                  low=link.lower()
                  if 'csv' in low or 'json' in low or 'resource' in low or 'dadosabertos.mec' in low or 'api' in low:
                      print(link[:1000])
              for needle in ['PDA_','Acessar o recurso','resource','distribuicao','downloadURL','accessURL']:
                  print('\n--',needle)
                  for m in list(re.finditer(needle,html,re.I))[:15]:
                      print(re.sub(r'\s+',' ',html[max(0,m.start()-350):min(len(html),m.end()+700)]))
          PY
