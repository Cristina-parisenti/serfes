name: Inspect MEC resources

on:
  push:
    paths:
      - '.github/workflows/inspect-consulta-escolas.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find public Dados.gov endpoints
        run: |
          python - <<'PY'
          import re, urllib.request
          urls=['https://dados.gov.br/static/js/app.a2f69268.js']
          # include lazy chunks named by the public dataset-detail route
          app=urllib.request.urlopen(urllib.request.Request(urls[0],headers={'User-Agent':'Mozilla/5.0'}),timeout=50).read().decode('utf-8','replace')
          chunk_names=sorted(set(re.findall(r'chunk-[0-9a-f]+',app)))
          urls += [f'https://dados.gov.br/static/js/{name}.js' for name in chunk_names]
          seen=set()
          for url in urls:
              try:
                  js=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
              except Exception:
                  continue
              hits=re.findall(r'["\'`](\/api\/publico\/[^"\'`]+)["\'`]',js)
              for h in hits:
                  if h not in seen:
                      seen.add(h); print(h)
          print('TOTAL',len(seen))
          PY
