name: Inspect MEC resources

on:
  push:
    paths:
      - '.github/workflows/inspect-consulta-escolas.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Dados.gov service configuration
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://dados.gov.br/static/js/app.a2f69268.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=50) as r:
              js=r.read().decode('utf-8','replace')
          for needle in ['baseURL','axios.create','api/','conjunto-dados/','recurso/','package_show','publico','API_URL']:
              print('\n###',needle)
              for m in list(re.finditer(re.escape(needle),js,re.I))[:30]:
                  print(js[max(0,m.start()-550):min(len(js),m.end()+1100)])
          PY
