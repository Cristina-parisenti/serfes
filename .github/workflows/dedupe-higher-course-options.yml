name: Ajustar opções duplicadas de cursos superiores

on:
  push:
    paths:
      - '.github/workflows/dedupe-higher-course-options.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Evitar nomes de cursos duplicados no seletor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  const higherCourseOptions = (higherEducation?.courses ?? [])
    .filter((course) => selectedHigherInstitution !== null && course.institutionId === selectedHigherInstitution.id)
    .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
"""
          new = """  const higherCourseOptions = Array.from(
    new Map(
      (higherEducation?.courses ?? [])
        .filter((course) => selectedHigherInstitution !== null && course.institutionId === selectedHigherInstitution.id)
        .map((course) => [normalizeEducationText(course.name), course] as const),
    ).values(),
  ).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Bloco de cursos superiores não localizado.')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validar aplicação
        run: |
          npm install
          npm run build
      - name: Publicar ajuste
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "Ajuste já aplicado."
            exit 0
          fi
          git config user.name "SERFES UI Update"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Evitar cursos duplicados no seletor do ensino superior"
          git pull --rebase origin main
          git push origin main
